[project]
name = "qwen-voice-chat-for-terminal"
version = "0.1.0"
description = "Qwen based voice chat for terminal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "numpy>=2.3.5",
    "scipy>=1.17.0",
    "sounddevice>=0.5.5",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers==4.57.6",
    "qwen-asr",
    "qwen-tts",
]

[tool.uv]
override-dependencies = ["transformers==4.57.6"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
